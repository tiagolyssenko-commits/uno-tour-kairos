name: Publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p site
          cp index.html steps.js LEIAME.txt favicon.svg site/ || true
          touch site/.nojekyll
          if ls assets/part* >/dev/null 2>&1; then
            cat assets/part* | base64 -d | tar -xzf - -C site
          fi
          if [ -d b64 ]; then
            find b64 -type f -name '*.b64' | while read -r f; do
              rel="${f#b64/}"
              out="site/${rel%.b64}"
              mkdir -p "$(dirname "$out")"
              base64 -d "$f" > "$out"
            done
          fi
          find site -type f | wc -l
      - name: Push publish branch
        run: |
          set -euo pipefail
          cd site
          git init
          git checkout -b publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish assembled UNO tour"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
