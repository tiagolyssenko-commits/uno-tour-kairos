<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1511">
<title>UNO · Tour do app</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: guia calmo e direto, como alguém mostrando o app no próprio celular
   IDEA: o app aberto de verdade, uma mão que toca e um balão que explica
   PICTURE: a tela do app ocupa tudo; nada compete com ela
   COLOUR: fundo verde-escuro do app; dourado = pastor, lilás = líder, verde = membro
   TYPE/LAYOUT: Plus Jakarta Sans; títulos 21–24px, explicação 18–20px; celular em tela cheia, no computador uma coluna de celular com o balão ao lado */
:root{--bg:#0b1511;--card:#13211a;--line:#2c4937;--fg:#f2f7f4;--mut:#a8bcb0;--a:#e8c376;--l:#a7aef7;--p:#66d6a0;--tone:var(--a);--font:'Plus Jakarta Sans',system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
:focus-visible{outline:3px solid var(--tone);outline-offset:2px;border-radius:10px}
svg.ic{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}

#wrap{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr)}
.bar{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:#08110d;border-bottom:1px solid #1b2b23;z-index:20}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:800;color:var(--tone)}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--tone)}
.bar .sp{flex:1}
.ib{height:40px;min-width:40px;padding:0 12px;border-radius:12px;background:#15241c;border:1px solid #24392d;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:14px;font-weight:700}
.ib.on{background:var(--tone);color:#0b1511;border-color:transparent}
.prog{position:absolute;left:0;right:0;bottom:-1px;height:3px;background:#16251d}
.prog i{display:block;height:100%;width:0;background:var(--tone);transition:width .5s}
.bar{position:relative}

.stage{position:relative;display:flex;justify-content:center;align-items:stretch}
.side{display:none}
#scr{position:relative;width:100%;height:100%;overflow:hidden;background:#0c1513}
#scr .shot{position:absolute;left:0;top:0;width:100%;height:auto;transform-origin:0 0;will-change:transform;transition:transform 1s cubic-bezier(.5,.05,.2,1)}
#scr .shot.new{animation:enter .45s cubic-bezier(.3,.7,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateX(40px)}}
#dock{position:absolute;left:0;bottom:0;width:100%;pointer-events:none;-webkit-mask-image:linear-gradient(transparent,#000 25%);mask-image:linear-gradient(transparent,#000 25%)}
#dim{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--hx,50%) var(--hy,50%),transparent 0,transparent 70px,rgba(4,9,7,.55) 150px);opacity:0;transition:opacity .4s}
#dim.on{opacity:1}
#ring{position:absolute;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;border:3px solid var(--tone);box-shadow:0 0 0 6px color-mix(in oklab,var(--tone) 28%,transparent),0 0 28px color-mix(in oklab,var(--tone) 70%,transparent);opacity:0;transform:scale(.5);transition:opacity .3s,transform .3s;pointer-events:none}
#ring.on{opacity:1;transform:scale(1)}
#hand{position:absolute;width:54px;height:64px;margin:-6px 0 0 -18px;pointer-events:none;transition:left .9s cubic-bezier(.5,.05,.2,1),top .9s cubic-bezier(.5,.05,.2,1),opacity .3s;filter:drop-shadow(0 8px 12px rgba(0,0,0,.55));z-index:5}
#hand.tap svg{animation:tap .5s ease}
@keyframes tap{40%{transform:scale(.8) translateY(3px)}}
.rip{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:color-mix(in oklab,var(--tone) 70%,white);pointer-events:none;animation:rip .7s ease-out forwards}
@keyframes rip{to{transform:scale(5);opacity:0}}

#card{position:absolute;left:12px;right:12px;padding:16px 16px 14px;border-radius:20px;background:rgba(14,26,20,.97);border:1px solid color-mix(in oklab,var(--tone) 45%,#2c4937);box-shadow:0 20px 50px -12px rgba(0,0,0,.75);z-index:6;transition:top .45s,bottom .45s,opacity .3s,transform .3s}
#card.hide{opacity:0;transform:translateY(8px);pointer-events:none}
#card .n{font-size:13px;font-weight:700;color:var(--mut)}
#card h2{margin:4px 0 0;font-size:22px;line-height:1.2;font-weight:800;color:var(--tone);letter-spacing:-.01em}
#card p{margin:6px 0 0;font-size:18.5px;line-height:1.45;font-weight:600;color:var(--fg)}
#card .row{display:flex;gap:10px;margin-top:14px}
#card .row button{flex:1;height:48px;border-radius:14px;background:#1a2b22;border:1px solid #2a4334;font-size:16px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:6px}
#card .row button.go{background:var(--tone);color:#0b1511;border-color:transparent}
#card .tm{height:4px;border-radius:4px;background:#1e3127;margin-top:12px;overflow:hidden}
#card .tm i{display:block;height:100%;width:0;background:var(--tone)}

/* capas de capítulo */
#over{position:absolute;inset:0;z-index:10;display:grid;place-items:center;padding:24px;text-align:left;background:linear-gradient(180deg,rgba(8,17,13,.55),rgba(8,17,13,.96) 55%)}
#over[hidden]{display:none}
#over .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;filter:blur(3px) brightness(.45);z-index:-1}
#over .box{width:min(440px,100%)}
#over .tag{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:color-mix(in oklab,var(--tone) 18%,transparent);color:var(--tone);font-size:14px;font-weight:800}
#over h1{margin:14px 0 0;font-size:clamp(34px,8vw,46px);line-height:1.05;letter-spacing:-.03em}
#over p{margin:12px 0 0;font-size:19px;line-height:1.5;color:#dfe9e3;font-weight:500}
#over .btns{display:grid;gap:10px;margin-top:24px}
#over .big{height:56px;border-radius:16px;background:var(--tone);color:#0b1511;font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px}
#over .alt{height:52px;border-radius:16px;background:#15241c;border:1px solid #2a4334;font-size:16px;font-weight:700;display:flex;align-items:center;gap:10px;padding:0 16px}
#over .alt i{width:10px;height:10px;border-radius:50%}

.narr-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.narr-opt{height:56px;border-radius:16px;background:#15241c;border:2px solid #2a4334;font-size:15.5px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px}
.narr-opt.on{background:color-mix(in oklab,var(--tone) 20%,#15241c);border-color:var(--tone);color:var(--tone)}
.narr-hint{margin:10px 0 0;font-size:13.5px;color:#a8bcb0;font-weight:600;line-height:1.4}
#bNarr.on{background:var(--tone);color:#0b1511;border-color:transparent}


/* índice */
#idx{position:fixed;inset:0;z-index:30;background:rgba(5,10,8,.94);overflow:auto;padding:calc(env(safe-area-inset-top) + 16px) 16px 24px}
#idx .in{max-width:560px;margin:0 auto}
#idx h2{font-size:24px;margin:0 0 6px;display:flex;justify-content:space-between;align-items:center}
#idx h3{font-size:14px;letter-spacing:.06em;margin:22px 0 8px}
#idx button.it{display:flex;width:100%;text-align:left;padding:14px 14px;border-radius:14px;background:#13211a;border:1px solid #22382c;margin-bottom:8px;font-size:17px;font-weight:700;gap:10px;align-items:center}
#idx button.it small{margin-left:auto;color:var(--mut);font-weight:600;font-size:13px}

/* computador: coluna de celular + balão ao lado */
@media (min-width:900px){
  .stage{padding:18px 0;gap:0}
  #phone{position:relative;height:100%;aspect-ratio:390/844;max-width:44vw;border-radius:34px;overflow:hidden;box-shadow:0 0 0 10px #18261f,0 0 0 11px #2c3f35,0 40px 90px -20px rgba(0,0,0,.8)}
  #card{left:calc(100% + 34px);right:auto;width:min(380px,28vw);bottom:auto}
  #card:before{content:"";position:absolute;left:-9px;top:var(--ay,40px);width:16px;height:16px;background:rgba(14,26,20,.97);border-left:1px solid color-mix(in oklab,var(--tone) 45%,#2c4937);border-bottom:1px solid color-mix(in oklab,var(--tone) 45%,#2c4937);transform:rotate(45deg)}
  #card h2{font-size:26px}#card p{font-size:20px}
  #phone{overflow:visible}#scr{border-radius:34px}
  .side{display:block;position:absolute;left:4vw;top:40px;width:22vw}
  .side .k{font-size:14px;font-weight:800;color:var(--tone)}
  .side .t{font-size:34px;font-weight:800;line-height:1.08;margin-top:8px;letter-spacing:-.02em}
  .side .d{font-size:17px;color:var(--mut);margin-top:12px;line-height:1.5}
}
@media (max-width:899px){#phone{position:relative;width:100%;height:100%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="wrap">
  <div class="bar">
    <span class="chip"><i></i><span id="chipT">UNO</span></span>
    <span class="sp"></span>
    <button class="ib" id="bNarr" aria-label="Narração" aria-pressed="false" title="Narração"></button>
    <button class="ib" id="bSpeed" aria-label="Velocidade">1x</button>
    <button class="ib" id="bPlay" aria-label="Reproduzir"></button>
    <button class="ib" id="bIdx" aria-label="Índice"><svg class="ic" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <div class="prog"><i id="progI"></i></div>
  </div>
  <div class="stage">
    <div class="side"><div class="k" id="sideK"></div><div class="t" id="sideT"></div><div class="d" id="sideD"></div></div>
    <div id="phone">
      <div id="scr">
        <img class="shot" id="shot" alt="">
        <img id="dock" alt="" hidden>
        <div id="dim"></div>
        <div id="ring"></div>
        <div id="hand"><svg viewBox="0 0 40 48" width="54" height="64"><path d="M14 4c2.2 0 4 1.8 4 4v13l2-.6c1.7-.5 3.5.4 4.1 2.1l.2.5 2.4-.4c1.9-.3 3.7.9 4.1 2.8l.1.5 1.5-.2c2.1-.2 4 1.3 4.2 3.4.1.5 0 1.1-.1 1.6L34 42c-.9 3.5-4.1 6-7.7 6H19c-2.6 0-5-1.3-6.5-3.4L4.3 32.8c-1.1-1.6-.7-3.8.9-4.9 1.4-1 3.3-.8 4.6.4l.2.2V8c0-2.2 1.8-4 4-4z" fill="#fbfdfc" stroke="#0b1511" stroke-width="2"/></svg></div>
        <div id="over" hidden></div>
      </div>
      <div id="card" class="hide" aria-live="polite">
        <div class="n" id="cN"></div><h2 id="cT"></h2><p id="cD"></p>
        <div class="tm"><i id="cTm"></i></div>
        <div class="row"><button id="bBack"><svg class="ic" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>Voltar</button><button class="go" id="bNext">Próximo<svg class="ic" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button></div>
      </div>
    </div>
  </div>
</div>
<div id="idx" hidden><div class="in" id="idxIn"></div></div>
<script src="steps.js"></script>
<script>
{
const $=s=>document.querySelector(s);
const H={"p_financas":844,"a_acomp":844,"l_registrar":844,"p_gastos2":2121,"p_perfil":844,"l_pessoas":844,"l_rel":844,"a_menu_mais":844,"a_relatorio_full":3126,"l_reg_2":844,"l_reg_1":844,"a_gp_detalhe":844,"p_devoc_full":1102,"p_fale_full":1064,"a_visao":844,"a_gp_detalhe2":844,"a_visao_full":1988,"a_com":844,"p_mapa":844,"l_reg_6":844,"a_ia":844,"a_rel":844,"l_perfil":844,"p_inicio_full":2151,"l_visao":844,"l_mapa":844,"a_quadro":844,"a_gps":844,"a_pessoas":844,"l_reg_4":844,"p_trilha":844,"a_mapa":844,"a_cont":844,"a_quadro_tema":844,"l_check":844,"a_quadro_regras":844,"p_inicio":844,"p_disc":844,"p_gp":844,"l_visao_full":1703,"a_quadro_check":844,"l_reg_5":844,"p_apoio":844};
const MODAL=new Set(['a_relatorio_full','p_fale_full']);
const DK={a_visao_full:'a_visao',l_visao_full:'l_visao',p_inicio_full:'p_inicio',p_devoc_full:'p_inicio',p_gastos2:'p_perfil'};
const TONE={a:'#e8c376',l:'#a7aef7',p:'#66d6a0',end:'#66d6a0'};
const NAME={a:'Área Pastoral',l:'Líder de GP',p:'Membro',end:'UNO'};
const DOCKN={a:['Início','GPs','Mapa','Relatórios','Mais'],l:['Visão geral','Pessoas','Registrar','Relatórios','Perfil'],p:['Início','Discipulado','Igrejas','Meu GP','Perfil']};
const T=window.TOUR;let role='a';T.forEach(s=>{if(s.chap)role=s.chap;s.r=role});
const PLAY='<svg class="ic" viewBox="0 0 24 24"><path d="M7 4v16l13-8z" fill="currentColor" stroke="none"/></svg>',PAUSE='<svg class="ic" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor" stroke="none"/><rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor" stroke="none"/></svg>';
const shot=$('#shot'),scr=$('#scr'),hand=$('#hand'),ring=$('#ring'),card=$('#card'),dock=$('#dock'),dim=$('#dim'),over=$('#over');
let cur=-1,playing=false,slow=false,token=0,curKey='',scroll=0,timer=null,raf=0,started=false;
const NARR_KEY='uno-tour-narration';
const SOUND='<svg class="ic" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const MUTE='<svg class="ic" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="m22 9-6 6M16 9l6 6"/></svg>';
const audioEl=new Audio();audioEl.preload='auto';
let narrate=localStorage.getItem(NARR_KEY)!=='off';
let audioTok=0,audioUnlocked=false;
function audioSrc(i){return 'audio/passo-'+String(i+1).padStart(3,'0')+'.mp3'}
function syncNarrUi(){
  const btn=$('#bNarr');
  if(btn){btn.innerHTML=narrate?SOUND:MUTE;btn.classList.toggle('on',narrate);btn.setAttribute('aria-pressed',narrate?'true':'false');btn.title=narrate?'Narração ligada':'Narração desligada';btn.setAttribute('aria-label',narrate?'Desligar narração':'Ligar narração')}
  document.querySelectorAll('[data-narr]').forEach(b=>b.classList.toggle('on',(b.dataset.narr==='on')===narrate));
}
function setNarrate(v){
  narrate=!!v;localStorage.setItem(NARR_KEY,narrate?'on':'off');syncNarrUi();
  if(!narrate){stopNarration();return}
  if(started&&cur>=0){restartHold()}
}
function stopNarration(){audioTok++;try{audioEl.pause()}catch(e){}}
async function unlockAudio(){
  if(audioUnlocked)return;
  try{audioEl.src='audio/silent.mp3';audioEl.muted=true;await audioEl.play();audioEl.pause();audioEl.currentTime=0;audioEl.muted=false;audioUnlocked=true}
  catch(e){audioEl.muted=false}
}
function playNarration(i){
  const my=++audioTok;
  try{audioEl.pause()}catch(e){}
  if(!narrate)return Promise.resolve(0);
  return new Promise(resolve=>{
    let settled=false;
    const done=ms=>{if(settled||my!==audioTok)return;settled=true;resolve(ms||0)};
    audioEl.onloadedmetadata=null;audioEl.onerror=null;audioEl.onended=null;
    audioEl.src=audioSrc(i);
    audioEl.onloadedmetadata=()=>{if(my===audioTok)done((audioEl.duration||0)*1000)};
    audioEl.onerror=()=>done(0);
    const p=audioEl.play();
    if(p)p.catch(()=>done(0));
    if(audioEl.readyState>=1&&isFinite(audioEl.duration)&&audioEl.duration>0)done(audioEl.duration*1000);
  });
}
function holdMs(st,audioMs){
  const base=st.chap?(st.chap==='end'?0:(slow?1.5:1)*6000):readMs(st);
  if(narrate&&audioMs)return Math.max(base,audioMs+800);
  return base;
}
async function restartHold(){
  if(cur<0)return;
  const my=token,st=T[cur];
  const ms=holdMs(st,await playNarration(cur));
  if(my!==token)return;
  if(!st.chap)timerBar(ms);
  clearTimeout(timer);
  if(playing&&!(st.chap==='end'))timer=setTimeout(()=>{if(my===token)show(cur+1)},ms);
}
function narrPicker(){
  return `<div class="narr-pick" role="group" aria-label="Narração">
    <button type="button" class="narr-opt${narrate?' on':''}" data-narr="on">${SOUND} Com narração</button>
    <button type="button" class="narr-opt${!narrate?' on':''}" data-narr="off">${MUTE} Sem narração</button>
  </div><p class="narr-hint">Você pode ligar ou desligar a narração a qualquer momento no botão de som no topo.</p>`;
}

const wait=ms=>new Promise(r=>setTimeout(r,ms));
const desk=()=>innerWidth>=900;
const scale=()=>scr.clientWidth/390;
const visH=()=>scr.clientHeight/scale();
const dockH=()=>dock.hidden?0:scr.clientWidth*168/780;

function setTone(r){document.documentElement.style.setProperty('--tone',TONE[r]);$('#chipT').textContent=NAME[r]}
function setShot(k,anim){if(curKey===k)return;curKey=k;shot.src=`img/${k}.jpg`;if(anim){shot.classList.remove('new');void shot.offsetWidth;shot.classList.add('new')}
  const dk=DK[k];dock.hidden=!dk;if(dk)dock.src=`img/dock_${dk}.jpg`;scroll=0;applyScroll(false)}
function applyScroll(anim=true){shot.style.transition=anim?'':'none';shot.style.transform=`translateY(${-scroll*scale()}px) scale(${scale()*390/scr.clientWidth})`;if(!anim){void shot.offsetWidth;shot.style.transition=''}}
function pointFor(st){const s=scale(),vh=visH(),max=Math.max(0,H[st.k]-vh);
  let want=st.y-vh*0.36;scroll=Math.min(max,Math.max(0,want));return{x:st.x/100*scr.clientWidth,y:(st.y-scroll)*s}}
function moveHand(x,y){hand.style.left=x+'px';hand.style.top=y+'px';hand.style.opacity=1}
function tapAt(x,y){hand.classList.remove('tap');void hand.offsetWidth;hand.classList.add('tap');const r=document.createElement('div');r.className='rip';r.style.left=x+'px';r.style.top=y+'px';scr.appendChild(r);setTimeout(()=>r.remove(),800)}
function placeCard(px,py){
  card.classList.remove('hide');
  if(desk()){const ph=$('#phone').clientHeight;const ch=card.offsetHeight;let top=Math.min(ph-ch-10,Math.max(10,py-60));card.style.top=top+'px';card.style.setProperty('--ay',Math.max(18,Math.min(ch-30,py-top-8))+'px');return}
  const h=scr.clientHeight,ch=card.offsetHeight;
  if(py>h*0.52){card.style.top='12px';card.style.bottom='auto'}else{card.style.top='auto';card.style.bottom=(dockH()+10)+'px'}
}
function prog(){const n=T.length;$('#progI').style.width=((cur+1)/n*100)+'%';$('#cN').textContent=`${NAME[T[cur].r]} · ${cur+1} de ${n}`}
function side(st){$('#sideK').textContent=NAME[st.r];const ch=[...T].slice(0,cur+1).reverse().find(s=>s.chap);$('#sideT').textContent=ch?ch.t:'';$('#sideD').textContent=ch?ch.d:''}
function readMs(st){return ((slow?1.5:1)*(2600+(st.t.length+st.d.length)*55))}
function timerBar(ms){cancelAnimationFrame(raf);const t0=performance.now(),el=$('#cTm');const f=n=>{const p=Math.min(1,(n-t0)/ms);el.style.width=p*100+'%';if(p<1&&playing)raf=requestAnimationFrame(f)};el.style.width='0';if(playing)raf=requestAnimationFrame(f)}

async function show(i,opts={}){
  if(i<0||i>=T.length)return;const my=++token;clearTimeout(timer);stopNarration();const prev=T[cur];const st=T[i];cur=i;setTone(st.r);prog();side(st);
  try{history.replaceState(null,'','#p'+(i+1))}catch(e){}
  if(st.chap){chapter(st);return}
  over.hidden=true;
  const changing=curKey!==st.k;
  if(changing&&!opts.jump&&prev&&!prev.chap&&curKey&&!(st.tap!=null&&MODAL.has(curKey))){
    card.classList.add('hide');ring.classList.remove('on');dim.classList.remove('on');
    let tx,ty;
    if(st.tap!=null){const slot=st.tap;tx=(0.14+slot*0.18)*scr.clientWidth;
      if(!dock.hidden){ty=scr.clientHeight-dockH()*0.42}
      else{const s=scale();scroll=Math.max(0,H[curKey]-visH());applyScroll();ty=(H[curKey]-30-scroll)*s;await wait(500);if(my!==token)return}}
    else{const p=pointFor(prev);applyScroll();tx=p.x;ty=p.y}
    moveHand(tx,ty);await wait(900);if(my!==token)return;tapAt(tx,ty);await wait(450);if(my!==token)return;
    setShot(st.k,true);await wait(380);if(my!==token)return;
  } else if(changing){setShot(st.k,false)}
  else if(!hand.style.left){}
  card.classList.add('hide');ring.classList.remove('on');
  const p=pointFor(st);applyScroll(true);
  await wait(changing?150:350);if(my!==token)return;
  moveHand(p.x,p.y+8);
  ring.style.left=p.x+'px';ring.style.top=p.y+'px';
  await wait(900);if(my!==token)return;
  tapAt(p.x,p.y);ring.classList.add('on');scr.style.setProperty('--hx',p.x+'px');scr.style.setProperty('--hy',p.y+'px');dim.classList.add('on');
  $('#cT').textContent=st.t;$('#cD').textContent=st.d;placeCard(p.x,p.y);
  const audioMs=await playNarration(i);if(my!==token)return;
  const ms=holdMs(st,audioMs);timerBar(ms);
  if(playing)timer=setTimeout(()=>{if(my===token)show(cur+1)},ms);
}
function chapter(st){
  const myTok=token;
  card.classList.add('hide');ring.classList.remove('on');dim.classList.remove('on');hand.style.opacity=0;
  over.hidden=false;
  const end=st.chap==='end';
  over.innerHTML=`<img class="bgimg" src="img/${st.img}.jpg" alt=""><div class="box"><span class="tag">${end?'Fim do tour':'Agora você vai ver'}</span><h1>${st.t}</h1><p>${st.d}</p><div class="btns">${end?`<button class="big" data-go="0">${PLAY} Assistir de novo</button>${['a','l','p'].map(r=>`<button class="alt" data-role="${r}"><i style="background:${TONE[r]}"></i>Rever: ${NAME[r]}</button>`).join('')}`:`<button class="big" data-next>${PLAY} Começar</button>`}</div></div>`;
  (async()=>{
    const audioMs=await playNarration(cur);if(myTok!==token)return;
    const ms=holdMs(st,audioMs);
    if(playing&&!end)timer=setTimeout(()=>{if(myTok===token)show(cur+1)},ms);
  })();
  curKey='';
}
function cover(){
  setTone('a');$('#chipT').textContent='UNO';over.hidden=false;card.classList.add('hide');hand.style.opacity=0;
  over.innerHTML=`<img class="bgimg" src="img/p_inicio.jpg" alt=""><div class="box"><span class="tag" style="color:#66d6a0;background:rgba(102,214,160,.15)">Tour do app</span><h1>Veja o UNO por dentro</h1><p>A mão mostra onde tocar e o balão explica, em uma frase, para que serve cada parte.</p>${narrPicker()}<div class="btns"><button class="big" data-start>${PLAY} Assistir o tour completo</button>${['a','l','p'].map(r=>`<button class="alt" data-role="${r}"><i style="background:${TONE[r]}"></i>Só a parte do ${r==='a'?'pastor':r==='l'?'líder':'membro'}</button>`).join('')}</div></div>`;
  syncNarrUi();
}
function setPlay(v){playing=v;$('#bPlay').innerHTML=v?PAUSE:PLAY;$('#bPlay').classList.toggle('on',v);clearTimeout(timer);
  if(!v){cancelAnimationFrame(raf);try{audioEl.pause()}catch(e){}return}
  if(cur<0)return;
  const st=T[cur];const my=token;
  if(narrate&&audioEl.src&&!audioEl.ended&&audioEl.currentTime>0){
    audioEl.play().catch(()=>{});
    const rem=Math.max(800,((audioEl.duration||0)-audioEl.currentTime)*1000+800);
    if(!st.chap)timerBar(rem);
    if(!(st.chap==='end'))timer=setTimeout(()=>{if(my===token)show(cur+1)},rem);
    return;
  }
  if(st.chap&&st.chap!=='end')timer=setTimeout(()=>show(cur+1),2500);
  else if(!st.chap){const ms=readMs(st);timerBar(ms);timer=setTimeout(()=>{if(my===token)show(cur+1)},ms)}
}
async function startAt(i){started=true;await unlockAudio();setPlay(true);show(i,{jump:true})}

document.addEventListener('click',e=>{
  const n=e.target.closest('[data-narr]');
  if(n){unlockAudio();setNarrate(n.dataset.narr==='on');e.stopPropagation();return}
  const t=e.target.closest('[data-start],[data-role],[data-next],[data-go],[data-jump]');
  if(t){if(t.dataset.start!=null)startAt(0);else if(t.dataset.role)startAt(T.findIndex(s=>s.chap===t.dataset.role));else if(t.dataset.next!=null){setPlay(true);show(cur+1)}else if(t.dataset.go!=null)startAt(0);else if(t.dataset.jump!=null){$('#idx').hidden=true;startAt(+t.dataset.jump)}return}
});
$('#bNext').onclick=()=>{setPlay(false);show(cur+1)};
$('#bBack').onclick=()=>{setPlay(false);let i=cur-1;show(i,{jump:true})};
$('#bPlay').onclick=()=>{if(!started){startAt(0);return}setPlay(!playing)};
$('#bSpeed').onclick=()=>{slow=!slow;$('#bSpeed').textContent=slow?'Devagar':'1x'};
$('#bIdx').onclick=()=>{setPlay(false);const ix=$('#idx');ix.hidden=!ix.hidden};
scr.addEventListener('click',e=>{if(over.hidden&&started){setPlay(false);show(cur+1)}});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){setPlay(false);show(cur+1)}else if(e.key==='ArrowLeft'){setPlay(false);show(cur-1,{jump:true})}else if(e.key===' '){e.preventDefault();$('#bPlay').click()}else if(e.key==='Escape')$('#idx').hidden=true});
addEventListener('resize',()=>{if(cur>=0&&!T[cur].chap){const st=T[cur];const p=pointFor(st);applyScroll(false);moveHand(p.x,p.y+8);ring.style.left=p.x+'px';ring.style.top=p.y+'px';scr.style.setProperty('--hx',p.x+'px');scr.style.setProperty('--hy',p.y+'px');placeCard(p.x,p.y)}});
// índice
{let html='<h2>Índice <button class="ib" onclick="document.getElementById(\'idx\').hidden=true">Fechar</button></h2>';let r='';
 T.forEach((s,i)=>{if(s.chap&&s.chap!=='end'){r=s.chap;html+=`<h3 style="color:${TONE[r]}">${NAME[r].toUpperCase()}</h3>`}
   if(s.chap==='end')return;
   if(s.chap||s.tap!=null||i===1){html+=`<button class="it" data-jump="${s.chap?i+1:i}">${s.chap?'Começo':s.t}<small>${s.chap?'':'abrir'}</small></button>`}});
 $('#idxIn').innerHTML=html}
setPlay(false);syncNarrUi();
$('#bNarr').onclick=()=>{unlockAudio();setNarrate(!narrate)};
const m=/^#p(\d+)$/.exec(location.hash);if(m){started=true;show(Math.min(T.length-1,+m[1]-1),{jump:true})}else cover();
setTimeout(()=>Object.keys(H).forEach(k=>{const im=new Image();im.src=`img/${k}.jpg`}),1200);
}
</script>
</body>
